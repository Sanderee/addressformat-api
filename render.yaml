services:
  - type: web
    name: addressformat-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PORT
        value: 3000
      # IMPORTANT: set this in the Render dashboard after deploy.
      # Use the same value in your RapidAPI Provider dashboard
      # under Settings → Code-Level Settings → Headers.
      # Without this, anyone with your Render URL can bypass RapidAPI.
      - key: RAPIDAPI_PROXY_SECRET
        sync: false
